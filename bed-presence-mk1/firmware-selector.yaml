# Firmware selector component for dynamic OTA updates
# Allows switching between WiFi and Ethernet firmware configurations

http_request:
  id: update_http_request
  useragent: esphome/device
  timeout: 10s

select:
  - platform: template
    id: firmware_selector
    name: Firmware Type
    icon: "mdi:router-network"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "WiFi"
      - "Ethernet"
    initial_option: "WiFi"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(firmware_selector).state == "Ethernet";'
            then:
              - logger.log: "OTA updates set to use ethernet firmware"
              - lambda: id(update_http_request).set_source_url("https://raw.githubusercontent.com/Gabriel-Lewis/sensor-configs/main/firmware/bed-presence-mk1-ethernet-manifest.json");
            else:
              - logger.log: "OTA updates set to use wifi firmware"
              - lambda: id(update_http_request).set_source_url("https://raw.githubusercontent.com/Gabriel-Lewis/sensor-configs/main/firmware/bed-presence-mk1-wifi-manifest.json");