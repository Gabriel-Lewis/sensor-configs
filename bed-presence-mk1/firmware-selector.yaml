# Firmware selector component for dynamic OTA updates
# Allows switching between WiFi and Ethernet firmware configurations

ota:
  - platform: http_request

update:
  - platform: http_request
    id: firmware_update_wifi
    name: "WiFi Firmware Update"
    source: "https://raw.githubusercontent.com/Gabriel-Lewis/sensor-configs/main/firmware/bed-presence-mk1-wifi-manifest.json"

  - platform: http_request
    id: firmware_update_ethernet
    name: "Ethernet Firmware Update"
    source: "https://raw.githubusercontent.com/Gabriel-Lewis/sensor-configs/main/firmware/bed-presence-mk1-ethernet-manifest.json"

select:
  - platform: template
    id: firmware_selector
    name: Firmware Type
    icon: "mdi:router-network"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "WiFi"
      - "Ethernet"
    initial_option: "WiFi"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(firmware_selector).state == "Ethernet";'
            then:
              - logger.log: "Firmware selector changed to Ethernet mode"
            else:
              - logger.log: "Firmware selector changed to WiFi mode"