# Ethernet network configuration for Bed Presence Mk1
# This file provides W5500 Ethernet connectivity

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9

# Note: Captive portal is not needed for Ethernet connections